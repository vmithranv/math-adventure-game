<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/math-adventure-game/icon-192.png" />
    <link rel="apple-touch-icon" href="/math-adventure-game/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nichus Maths" />
    <link rel="manifest" href="/math-adventure-game/manifest.json" />
    <title>Nichus Maths Game</title>
  </head>
  <body class="bg-slate-100/90 text-slate-800 overflow-x-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/math-adventure-game/sw.js', { scope: '/math-adventure-game/' })
            .then(reg => console.log('SW registered!', reg))
            .catch(err => console.error('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
